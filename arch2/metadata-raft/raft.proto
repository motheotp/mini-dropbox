syntax = "proto3";

package raft;

// Raft Service
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc ClientRequest(ClientRequestMsg) returns (ClientResponse);
}

// Leader Election Messages
message RequestVoteRequest {
  int32 term = 1;
  string candidate_id = 2;
  int32 last_log_index = 3;
  int32 last_log_term = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  bool vote_granted = 2;
  string voter_id = 3;
}

// Log Replication Messages
message LogEntry {
  int32 term = 1;
  int32 index = 2;
  string operation = 3;
  string filename = 4;
  string username = 5;
  bytes data = 6;
}

message AppendEntriesRequest {
  int32 term = 1;
  string leader_id = 2;
  int32 prev_log_index = 3;
  int32 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int32 leader_commit = 6;  // commit index
}

message AppendEntriesResponse {
  int32 term = 1;
  bool success = 2;
  string follower_id = 3;
  int32 match_index = 4;
}

// Client Request Messages
message ClientRequestMsg {
  string operation = 1;  // "upload", "download", "delete"
  string filename = 2;
  string username = 3;
  bytes data = 4;
}

message ClientResponse {
  bool success = 1;
  string message = 2;
  string leader_id = 3;  // if not leader, redirect to this
  bytes data = 4;
}